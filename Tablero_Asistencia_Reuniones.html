<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#123B5D" />
  <title>Asistencia a reuniones | Del Palacio</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23123B5D'/%3E%3Cpath d='M17 20h30v24H17z' fill='%23fff'/%3E%3Cpath d='M24 32l5 5 11-12' fill='none' stroke='%23123B5D' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <style>
    :root{--navy:#123b5d;--blue:#16759d;--pale:#edf5f8;--line:#d8e3eb;--ink:#15242f;--muted:#627482;--good:#1e8754}*{box-sizing:border-box}body{margin:0;background:#f6f8fa;color:var(--ink);font-family:Arial,Helvetica,sans-serif}header{background:var(--navy);color:#fff;padding:22px max(22px,calc((100vw - 1250px)/2));display:flex;gap:18px;justify-content:space-between;align-items:center}h1{margin:0;font-size:1.55rem}header p{margin:5px 0 0;color:#c7ddeb;font-size:.92rem}.button{border:0;background:#fff;color:var(--navy);border-radius:7px;padding:11px 15px;font-weight:bold;cursor:pointer;font-size:.92rem}.button:disabled{opacity:.65;cursor:wait}main{max-width:1250px;margin:0 auto;padding:24px 22px 46px}.state{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;color:var(--muted);font-size:.88rem}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--good);margin-right:6px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:17px}.card .n{font-size:1.8rem;font-weight:700;color:var(--navy)}.card .l{margin-top:5px;color:var(--muted);font-size:.86rem}.grid{display:grid;grid-template-columns:1.05fr .95fr;gap:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;overflow:hidden}.panel h2{font-size:1rem;margin:0 0 14px;color:var(--navy)}table{border-collapse:collapse;width:100%;font-size:.88rem}th{font-size:.75rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);text-align:left;border-bottom:1px solid var(--line);padding:9px 7px}td{padding:10px 7px;border-bottom:1px solid #eef2f4;vertical-align:top}.num{text-align:right;font-variant-numeric:tabular-nums}.rank{display:flex;align-items:center;gap:9px}.bar{height:8px;border-radius:8px;background:var(--blue);min-width:3px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}input,select{border:1px solid var(--line);border-radius:6px;padding:10px;font:inherit;min-width:185px}.wide{grid-column:1/-1}.person-note{color:var(--muted);font-size:.78rem;line-height:1.35}.empty{color:var(--muted);padding:25px 0;text-align:center}.clock{--p:0;--c:#c85151;width:48px;height:48px;margin-left:auto;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at center,#fff 57%,transparent 59%),conic-gradient(var(--c) calc(var(--p)*1%),#e6edf1 0);font-size:.7rem;font-weight:700;color:var(--ink)}@media(max-width:800px){header{align-items:flex-start;flex-direction:column}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}main{padding:18px 14px}.wide{grid-column:auto}}@media(max-width:440px){.cards{grid-template-columns:1fr}h1{font-size:1.3rem}}
  </style>
</head>
<body>
<header><div><h1>Gestión de asistencia a reuniones</h1><p>Del Palacio S.A. · Datos 2026</p></div><button id="refresh" class="button">Actualizar datos</button></header>
<main>
  <div class="state"><span id="status"><span class="dot"></span>Listo para sincronizar</span><span id="period"></span></div>
  <section class="cards" id="cards"></section>
  <section class="grid">
    <article class="panel"><h2>Participación por reunión</h2><div id="meetings"></div></article>
    <article class="panel"><h2>Principales participantes</h2><div id="ranking"></div></article>
    <article class="panel wide"><h2>Asistencia por persona</h2><div class="filters"><input id="search" placeholder="Buscar persona" /><select id="meetingFilter"><option value="">Todas las reuniones</option></select></div><div id="people"></div></article>
  </section>
</main>
<script>
const SOURCE='https://docs.google.com/spreadsheets/d/e/2PACX-1vQHGo--AwUutsRSHFeIYPI4i3-WKoDocoMmfhhZ75yzLf2eHWiCDxJQNK3P0Ev_h2_N0cv_NzClmhfb/pub?gid=254789935&single=true&output=csv';
let model={people:[],meetings:[],summary:{}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function csvRows(text){const rows=[];let row=[],v='',q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'&&q&&n==='"'){v+='"';i++}else if(c==='"'){q=!q}else if(c===','&&!q){row.push(v);v=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(v);if(row.some(x=>x))rows.push(row);row=[];v=''}else v+=c}if(v||row.length){row.push(v);rows.push(row)}return rows}
function dateKey(raw){let [d,m,y]=String(raw).trim().split('/').map(Number);if(y===26||y===2206)y=2026;if(!d||!m||!y)return null;return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
function cleanName(n){n=String(n||'').trim().toUpperCase().replace(/\s+/g,' ');return n==='FLORENCIA VISCONTI'?'VISCONTI FLORENCIA':n}
function parse(text){const rows=csvRows(text).slice(1), seen=new Set(), records=[];for(const r of rows){if(!/^2026\s/.test(r[5]||''))continue;const meeting=(r[1]||'').trim().toUpperCase(),name=cleanName(r[3]),date=dateKey(r[2]);if(!meeting||!name||!date)continue;const key=[name,meeting,date].join('|');if(seen.has(key))continue;seen.add(key);records.push({name,meeting,date,sector:(r[4]||'').trim().toUpperCase()})}const sessionCounts={};records.forEach(x=>sessionCounts[x.meeting]=new Set([...(sessionCounts[x.meeting]||[]),x.date]));Object.keys(sessionCounts).forEach(k=>sessionCounts[k]=sessionCounts[k].size);const byPerson={};records.forEach(x=>{const p=byPerson[x.name]??={name:x.name,sectors:new Set(),meetings:{}};p.sectors.add(x.sector);p.meetings[x.meeting]??=[];p.meetings[x.meeting].push(x.date);byPerson[x.name]=p});const people=Object.values(byPerson).map(p=>{const meetings=Object.entries(p.meetings).map(([meeting,dates])=>({meeting,count:dates.length,sessions:sessionCounts[meeting],dates:dates.sort()}));const possible=meetings.reduce((sum,m)=>sum+m.sessions,0);return {name:p.name,sector:[...p.sectors].filter(Boolean).join(', '),total:Object.values(p.meetings).flat().length,possible,rate:possible?Object.values(p.meetings).flat().length/possible:0,types:Object.keys(p.meetings).length,meetings}}).sort((a,b)=>b.total-a.total||a.name.localeCompare(b.name));const meetings=Object.entries(sessionCounts).map(([meeting,sessions])=>{const list=records.filter(x=>x.meeting===meeting);return {meeting,sessions,records:list.length,people:new Set(list.map(x=>x.name)).size,average:(list.length/sessions).toFixed(1)}}).sort((a,b)=>b.records-a.records);return {people,meetings,summary:{people:people.length,meetingTypes:meetings.length,sessions:Object.values(sessionCounts).reduce((a,b)=>a+b,0),records:records.length,period:'10/01/2026 al 21/09/2026'}}}
function render(){const s=model.summary;document.getElementById('period').textContent=`Período: ${s.period}`;document.getElementById('cards').innerHTML=[[s.people,'Personas con asistencia'],[s.meetingTypes,'Tipos de reunión'],[s.sessions,'Reuniones realizadas'],[s.records,'Asistencias únicas']].map(([n,l])=>`<div class="card"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');document.getElementById('meetings').innerHTML=`<table><thead><tr><th>Reunión</th><th class="num">Sesiones</th><th class="num">Personas</th><th class="num">Prom.</th></tr></thead><tbody>${model.meetings.map(m=>`<tr><td>${esc(m.meeting)}</td><td class="num">${m.sessions}</td><td class="num">${m.people}</td><td class="num">${m.average}</td></tr>`).join('')}</tbody></table>`;const max=model.people[0]?.total||1;document.getElementById('ranking').innerHTML=`<table><thead><tr><th>Persona</th><th class="num">Asistencias</th></tr></thead><tbody>${model.people.slice(0,10).map(p=>`<tr><td><div class="rank"><span class="bar" style="width:${Math.max(4,p.total/max*100)}px"></span>${esc(p.name)}</div></td><td class="num">${p.total}</td></tr>`).join('')}</tbody></table>`;const select=document.getElementById('meetingFilter'),current=select.value;select.innerHTML='<option value="">Todas las reuniones</option>'+model.meetings.map(m=>`<option value="${esc(m.meeting)}">${esc(m.meeting)}</option>`).join('');select.value=current;renderPeople()}
function renderPeople(){const query=document.getElementById('search').value.trim().toUpperCase(),meeting=document.getElementById('meetingFilter').value;const list=model.people.filter(p=>p.name.includes(query)&&(!meeting||p.meetings.some(m=>m.meeting===meeting)));document.getElementById('people').innerHTML=list.length?`<table><thead><tr><th>Persona</th><th>Sector</th><th class="num">Asistencias</th><th class="num">% asistencia</th><th class="num">Tipos</th><th>Reuniones asistidas</th></tr></thead><tbody>${list.map(p=>{const pct=Math.round(p.rate*100),color=pct>=80?'#1e8754':pct>=60?'#d78b20':'#c85151';return `<tr><td><strong>${esc(p.name)}</strong></td><td>${esc(p.sector||'—')}</td><td class="num">${p.total}</td><td class="num"><span class="clock" style="--p:${pct};--c:${color}" aria-label="${pct}% de asistencia">${pct}%</span></td><td class="num">${p.types}</td><td class="person-note">${p.meetings.map(m=>`${esc(m.meeting)}: ${m.count}/${m.sessions} (${(m.count/m.sessions*100).toFixed(0)}%)`).join('<br>')}</td></tr>`}).join('')}</tbody></table><p class="person-note">El porcentaje general se calcula sobre las sesiones de los tipos de reunión en los que la persona tuvo participación registrada.</p>`:'<div class="empty">No hay personas que coincidan con el filtro.</div>'}
async function sync(){const b=document.getElementById('refresh');b.disabled=true;document.getElementById('status').innerHTML='Sincronizando datos…';try{const res=await fetch(SOURCE,{cache:'no-store'});if(!res.ok)throw new Error('No se pudo leer la planilla');model=parse(await res.text());render();document.getElementById('status').innerHTML=`<span class="dot"></span>Actualizado el ${new Date().toLocaleString('es-AR')}`}catch(e){document.getElementById('status').textContent='No fue posible sincronizar. Revisá que la planilla siga publicada.'}finally{b.disabled=false}}
document.getElementById('refresh').addEventListener('click',sync);document.getElementById('search').addEventListener('input',renderPeople);document.getElementById('meetingFilter').addEventListener('change',renderPeople);
if(document.modelContext?.registerTool){const ctl=new AbortController();document.modelContext.registerTool({name:'actualizar_asistencias',title:'Actualizar asistencias',description:'Actualiza el tablero desde la planilla pública de asistencia.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:true},execute:async()=>{await sync();return {personas:model.summary.people,asistencias:model.summary.records,periodo:model.summary.period}}},{signal:ctl.signal}).catch(()=>{});}
sync();
</script>
</body>
</html>
